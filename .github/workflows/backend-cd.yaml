name: "Backend Continuous Deployment"

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.sha }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      NAMESPACE: ${{ secrets.KUBE_NAMESPACE || 'default' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install pipenv
        run: python -m pip install --upgrade pip pipenv

      - name: Verify required files exist
        run: |
          set -e
          test -f starter/backend/Dockerfile
          test -f starter/backend/Pipfile
          test -f starter/backend/k8s/deployment.yaml
          test -f starter/backend/k8s/service.yaml

      - name: Prepare image tag
        run: |
          set -e
          # Use ECR_REPOSITORY if provided; otherwise default to local image name 'backend'
          REPO=${ECR_REPOSITORY:-backend}
          IMAGE=${REPO}:${IMAGE_TAG}
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          echo "Prepared image: $IMAGE"

      - name: Install dependencies (pipenv)
        working-directory: starter/backend
        run: pipenv install --dev

      - name: Lint
        working-directory: starter/backend
        run: pipenv run lint

      - name: Test
        working-directory: starter/backend
        run: pipenv run test

      - name: Configure AWS credentials for ECR
        if: ${{ secrets.AWS_ACCESS_KEY_ID && secrets.AWS_SECRET_ACCESS_KEY && secrets.ECR_REPOSITORY }}
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        if: ${{ secrets.AWS_ACCESS_KEY_ID && secrets.AWS_SECRET_ACCESS_KEY && secrets.ECR_REPOSITORY }}
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build Docker image
        working-directory: starter/backend
        run: |
          set -e
          docker build -t "$IMAGE" .

      - name: Validate Docker image by running container
        run: |
          set -e
          # Run container in background, map to an ephemeral port and hit /movies
          PORT=5001
          docker run -d --rm --name backend-smoke -p ${PORT}:5000 "$IMAGE"
          # wait for a short time for app to start
          retries=0
          until curl -sS http://localhost:${PORT}/movies || [ $retries -ge 10 ]; do
            retries=$((retries+1))
            sleep 1
          done
          curl -fsS http://localhost:${PORT}/movies
          docker rm -f backend-smoke || true

      - name: Push image to ECR
        if: ${{ secrets.AWS_ACCESS_KEY_ID && secrets.AWS_SECRET_ACCESS_KEY && secrets.ECR_REPOSITORY }}
        run: |
          set -e
          docker push "$IMAGE"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          if [ -n "${{ secrets.KUBE_CONFIG_BASE64 }}" ]; then
            echo "Decoding KUBE_CONFIG_BASE64"
            echo "${{ secrets.KUBE_CONFIG_BASE64 }}" | base64 --decode > $HOME/.kube/config
          elif [ -n "${{ secrets.KUBE_CONFIG }}" ]; then
            echo "Writing KUBE_CONFIG"
            echo "${{ secrets.KUBE_CONFIG }}" > $HOME/.kube/config
          else
            echo "No kubeconfig provided in secrets (KUBE_CONFIG_BASE64 or KUBE_CONFIG)" >&2
            exit 1
          fi
          chmod 600 $HOME/.kube/config

      - name: Deploy to Kubernetes
        run: |
          set -e
          NAMESPACE=${NAMESPACE:-default}
          kubectl set image deployment/backend backend="$IMAGE" -n "$NAMESPACE" --record
          kubectl rollout status deployment/backend -n "$NAMESPACE" --timeout=120s

      - name: Verify backend API
        run: |
          set -e
          NAMESPACE=${NAMESPACE:-default}
          SERVICE_IP=$(kubectl get svc backend -n "$NAMESPACE" -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
          SERVICE_HOST=$(kubectl get svc backend -n "$NAMESPACE" -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
          if [ -n "$SERVICE_IP" ]; then
            echo "Found external IP: $SERVICE_IP"
            curl -fsS "http://$SERVICE_IP/movies"
          elif [ -n "$SERVICE_HOST" ]; then
            echo "Found external hostname: $SERVICE_HOST"
            curl -fsS "http://$SERVICE_HOST/movies"
          else
            echo "No external IP; port-forwarding to test service in namespace $NAMESPACE"
            kubectl port-forward -n "$NAMESPACE" svc/backend 5000:80 >/tmp/port-forward.log 2>&1 &
            PF_PID=$!
            sleep 3
            curl -fsS http://localhost:5000/movies
            kill $PF_PID || true
          fi
