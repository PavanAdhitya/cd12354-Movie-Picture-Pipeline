name: "Backend Continuous Deployment"

on:
  push:
    branches: [ main ]
    paths:
      - 'starter/backend/**'
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pipenv
        run: python -m pip install --upgrade pip pipenv

      - name: Install dependencies
        working-directory: starter/backend
        run: pipenv install --dev

      - name: Run lint
        working-directory: starter/backend
        run: pipenv run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pipenv
        run: python -m pip install --upgrade pip pipenv

      - name: Install dependencies
        working-directory: starter/backend
        run: pipenv install --dev

      - name: Run tests
        working-directory: starter/backend
        run: pipenv run test

  build:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        working-directory: starter/backend
        run: |
          set -e
          docker build -t ${{ secrets.ECR_REPOSITORY }}:${{ github.sha }} .

      - name: Run Docker container smoke test
        run: |
          set -e
          docker run -d --rm --name backend-smoke -p 5001:5000 ${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}
          sleep 5
          curl -fsS http://localhost:5001/movies
          docker stop backend-smoke

      - name: Push Docker image to ECR
        run: |
          set -e
          docker push ${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Update kubeconfig
        run: |
          set -e
          aws eks update-kubeconfig --name cluster --region ${{ secrets.AWS_REGION }}

      - name: Apply Kubernetes manifests
        working-directory: starter/backend/k8s
        run: |
          set -e
          kustomize build . | kubectl apply -f -

      - name: Set deployment image
        run: |
          set -e
          kubectl set image deployment/backend backend=${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Wait for rollout
        run: |
          set -e
          kubectl rollout status deployment/backend --timeout=180s
